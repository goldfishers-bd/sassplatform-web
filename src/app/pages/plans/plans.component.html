<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="card">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Plans</h2>
        <p-button label="New Plan" icon="pi pi-plus" (onClick)="openCreate()"></p-button>
    </div>

    <p-table [value]="plans()" [loading]="loading()" [paginator]="true" [rows]="10" responsiveLayout="scroll">
        <ng-template pTemplate="header">
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Billing</th>
                <th>Max Users</th>
                <th>Status</th>
                <th style="width: 120px"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-plan>
            <tr>
                <td>{{ plan.name }}</td>
                <td>{{ plan.price | currency }}</td>
                <td>{{ plan.billingCycle }}</td>
                <td>{{ plan.maxUsers }}</td>
                <td>
                    <span class="px-2 py-1 rounded text-sm"
                        [ngClass]="plan.isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
                        {{ plan.isActive ? 'Active' : 'Inactive' }}
                    </span>
                </td>
                <td>
                    <p-button icon="pi pi-pencil" [text]="true" (onClick)="openEdit(plan)"></p-button>
                    <p-button icon="pi pi-trash" severity="danger" [text]="true"
                        (onClick)="confirmDelete(plan)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center">No plans found.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '30rem' }"
    [header]="isEditMode() ? 'Edit Plan' : 'New Plan'">
    <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
        <div>
            <label class="block mb-2">Name</label>
            <input pInputText formControlName="name" class="w-full" />
        </div>
        <div>
            <label class="block mb-2">Description</label>
            <input pInputText formControlName="description" class="w-full" />
        </div>
        <div class="flex gap-4">
            <div class="flex-1">
                <label class="block mb-2">Price</label>
                <p-inputNumber formControlName="price" mode="currency" currency="USD" styleClass="w-full"
                    inputStyleClass="w-full"></p-inputNumber>
            </div>
            <div class="flex-1">
                <label class="block mb-2">Max Users</label>
                <p-inputNumber formControlName="maxUsers" [min]="1" styleClass="w-full"
                    inputStyleClass="w-full"></p-inputNumber>
            </div>
        </div>
        <div>
            <label class="block mb-2">Billing Cycle</label>
            <p-select formControlName="billingCycle" [options]="billingCycleOptions" optionLabel="label"
                optionValue="value" styleClass="w-full"></p-select>
        </div>
        <div *ngIf="isEditMode()" class="flex items-center gap-3">
            <p-toggleSwitch formControlName="isActive"></p-toggleSwitch>
            <label>Active</label>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <p-button label="Cancel" [text]="true" (onClick)="dialogVisible.set(false)"></p-button>
        <p-button label="Save" [loading]="saving()" [disabled]="form.invalid" (onClick)="save()"></p-button>
    </ng-template>
</p-dialog>
