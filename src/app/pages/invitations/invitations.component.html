<p-toast></p-toast>

<div class="card">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Invitations</h2>
        <p-button label="Invite User" icon="pi pi-send" (onClick)="openInvite()"></p-button>
    </div>

    <p-table [value]="invitations()" [loading]="loading()" [paginator]="true" [rows]="10" responsiveLayout="scroll">
        <ng-template pTemplate="header">
            <tr>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Expires</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-invite>
            <tr>
                <td>{{ invite.email }}</td>
                <td>{{ invite.role }}</td>
                <td><p-tag [value]="invite.status" [severity]="statusSeverity(invite.status)"></p-tag></td>
                <td>{{ invite.expiresAt | date:'medium' }}</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4" class="text-center">No pending invitations.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '28rem' }" header="Invite User">
    <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
        <div>
            <label class="block mb-2">Email</label>
            <input pInputText formControlName="email" class="w-full" placeholder="user@company.com" />
        </div>
        <div>
            <label class="block mb-2">Role</label>
            <p-select formControlName="role" [options]="roleOptions" optionLabel="label" optionValue="value"
                styleClass="w-full"></p-select>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <p-button label="Cancel" [text]="true" (onClick)="dialogVisible.set(false)"></p-button>
        <p-button label="Send Invite" [loading]="sending()" [disabled]="form.invalid" (onClick)="send()"></p-button>
    </ng-template>
</p-dialog>
