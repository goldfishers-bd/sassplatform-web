<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="card">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Tenants</h2>
        <p-button label="New Tenant" icon="pi pi-plus" (onClick)="openCreate()"></p-button>
    </div>

    <p-table [value]="tenants()" [loading]="loading()" [paginator]="true" [rows]="10" responsiveLayout="scroll">
        <ng-template pTemplate="header">
            <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Created</th>
                <th style="width: 120px"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-tenant>
            <tr>
                <td>{{ tenant.name }}</td>
                <td>
                    <span class="px-2 py-1 rounded text-sm"
                        [ngClass]="tenant.isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
                        {{ tenant.isActive ? 'Active' : 'Inactive' }}
                    </span>
                </td>
                <td>{{ tenant.createdAt | date:'mediumDate' }}</td>
                <td>
                    <p-button icon="pi pi-pencil" [text]="true" (onClick)="openEdit(tenant)"></p-button>
                    <p-button icon="pi pi-trash" severity="danger" [text]="true"
                        (onClick)="confirmDelete(tenant)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4" class="text-center">No tenants found.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '30rem' }"
    [header]="isEditMode() ? 'Edit Tenant' : 'New Tenant'">
    <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
        <div>
            <label for="name" class="block mb-2">Name</label>
            <input pInputText id="name" formControlName="name" class="w-full" />
        </div>

        <div *ngIf="isEditMode()" class="flex items-center gap-3">
            <p-toggleSwitch formControlName="isActive"></p-toggleSwitch>
            <label>Active</label>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <p-button label="Cancel" [text]="true" (onClick)="dialogVisible.set(false)"></p-button>
        <p-button label="Save" [loading]="saving()" [disabled]="form.invalid" (onClick)="save()"></p-button>
    </ng-template>
</p-dialog>
