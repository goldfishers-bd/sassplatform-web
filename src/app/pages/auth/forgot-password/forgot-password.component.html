<div class="flex items-center justify-center min-h-screen">
    <div class="bg-white dark:bg-surface-900 p-6 shadow-md rounded-xl w-full lg:w-1/3">

        <div *ngIf="submitted()">
            <p-message severity="success" text="If that email exists, a reset link has been sent."></p-message>
            <div class="text-center mt-4">
                <a routerLink="/auth/login" class="text-primary">Back to Sign In</a>
            </div>
        </div>

        <form *ngIf="!submitted()" [formGroup]="form" (ngSubmit)="onSubmit()">
            <h2 class="text-center mb-6 text-xl font-semibold">Forgot Password</h2>

            <div class="mb-4">
                <label for="email" class="block mb-2">Email</label>
                <input pInputText id="email" formControlName="email" class="w-full" placeholder="you@company.com" />
            </div>

            <p-button type="submit" label="Send Reset Link" styleClass="w-full" [loading]="loading()"
                [disabled]="form.invalid"></p-button>

            <div class="text-center mt-4">
                <a routerLink="/auth/login" class="text-primary">Back to Sign In</a>
            </div>
        </form>

    </div>
</div>
