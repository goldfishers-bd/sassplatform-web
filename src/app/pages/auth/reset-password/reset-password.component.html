<div class="flex items-center justify-center min-h-screen">
    <div class="bg-white dark:bg-surface-900 p-6 shadow-md rounded-xl w-full lg:w-1/3">

        <div *ngIf="linkInvalid()">
            <p-message severity="error" text="Invalid reset link."></p-message>
        </div>

        <form *ngIf="!linkInvalid()" [formGroup]="form" (ngSubmit)="onSubmit()">
            <h2 class="text-center mb-6 text-xl font-semibold">Reset Password</h2>

            <div class="mb-4">
                <label for="newPassword" class="block mb-2">New Password</label>
                <p-password id="newPassword" formControlName="newPassword" [toggleMask]="true" styleClass="w-full"
                    inputStyleClass="w-full"></p-password>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="block mb-2">Confirm Password</label>
                <p-password id="confirmPassword" formControlName="confirmPassword" [feedback]="false"
                    [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
            </div>

            <p-message *ngIf="errorMessage()" severity="error" [text]="errorMessage()!"
                styleClass="w-full mb-4"></p-message>

            <p-button type="submit" label="Reset Password" styleClass="w-full" [loading]="loading()"
                [disabled]="form.invalid"></p-button>
        </form>

    </div>
</div>
